# Ultralytics YOLO 🚀, AGPL-3.0 license
# Dual-stream YOLOv8 model with fusion capabilities

# Parameters
nc: 28  # number of classes

scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# YOLOv8 backbone
# backbone:
#   [
#     [-1, 1, MultiStreamConv, [64, 6, 2, 2]],
#     [-1, 1, MultiStreamConv, [64, 3, 2]],
#     [-1, 3, MultiStreamC3, [64]],
#     [-1, 1, Conv, [128, 3, 2]],
#     [-1, 6, C3, [128]],
#     [-1, 1, Conv, [256, 3, 2]],
#     [-1, 9, C3, [256]],
#     [-1, 1, Conv, [512, 3, 2]],
#     [-1, 3, C3, [512]],
#     [-1, 1, SPPF, [512, 5]],
#   ]

backbone:
  [
    [-1, 1, SpatialAlignedMultiStreamConv, [64, 6, 2, 2]],
    [-1, 1, SpatialAlignedMultiStreamConv, [64, 3, 2]],
    [-1, 3, MultiStreamC3, [64]],
    [-1, 1, Conv, [128, 3, 2]],
    [-1, 6, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]],
    [-1, 9, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]],
    [-1, 3, C3, [512]],
    [-1, 1, SPPF, [512, 5]],
  ]

# YOLOv8 head
head:
  [
    [-1, 1, nn.Upsample, [None, 2, 'nearest']],
    [[-1, 6], 1, Concat, [1]],
    [-1, 3, C2f, [256]],

    [-1, 1, nn.Upsample, [None, 2, 'nearest']],
    [[-1, 4], 1, Concat, [1]],
    [-1, 3, C2f, [128]],

    [-1, 1, Conv, [128, 3, 2]],
    [[-1, 12], 1, Concat, [1]],
    [-1, 3, C2f, [256]],

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 9], 1, Concat, [1]],
    [-1, 3, C2f, [512]],

    [[15, 18, 21], 1, Detect, [nc]],
  ]