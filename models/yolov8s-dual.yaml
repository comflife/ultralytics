# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 28 # number of classes
with_depth: True  # 🔴 depth estimation 활성화

scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  # n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# Dual-stream YOLO backbone (입력: [B,6,H,W] – 채널 concat, NPU 호환 16배수 채널)
backbone:
  - [-1, 1, MultiStreamConv, [64, 3, 2]] # 0-P1/2  # c2=64 (16배수), k=3, s=2
  # - [-1, 1, SpatialAlignedMultiStreamConv, [128, 3, 2]] # 1-P2/4  # c2=128 (16배수), k=3, s=2
  - [-1, 1, SpatialAlignedMultiStreamConv, [128, [512, 512], 3, 2]]
  - [-1, 3, C2f, [128, True]] # 2  # 128채널 유지 (16배수)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8  # 128->256 (16배수), k=3, s=2
  - [-1, 6, C2f, [256, True]] # 4  # 256채널 유지 (16배수)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16  # 256->512 (16배수), k=3, s=2
  - [-1, 6, C2f, [512, True]] # 6  # 512채널 유지 (16배수)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32  # 512->1024 (16배수), k=3, s=2
  - [-1, 3, C2f, [1024, True]] # 8  # 1024채널 유지 (16배수)
  - [-1, 1, SPPF, [1024, 5]] # 9  # 1024채널, k=5

# YOLO head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4 (1024+512=1536)
  - [-1, 3, C2f, [512]] # 12  # 1536->512

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3 (512+256=768)
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)  # 768->256

  - [-1, 1, Conv, [256, 3, 2]]  # 256->256
  - [[-1, 12], 1, Concat, [1]] # cat head P4 (256+512=768)
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)  # 768->512

  - [-1, 1, Conv, [512, 3, 2]]  # 512->512
  - [[-1, 9], 1, Concat, [1]] # cat head P5 (512+1024=1536)
  - [-1, 3, C2f, [1024]] # 21 (P5/32-large)  # 1536->1024

  - [[15, 18, 21], 1, Detect, [nc, with_depth]] # 🔴 Detect(P3, P4, P5) with depth estimation